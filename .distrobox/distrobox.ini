# baxyz orchestrator — distrobox definition
#
# distrobox equivalent of the existing .devcontainer/devcontainer.json, while
# keeping the AI agent (Claude Code) on the host: this box only runs
# node/pnpm/git-lfs, it does not host the agent.
#
# Usage:
#   distrobox assemble create --file .distrobox/distrobox.ini
#   distrobox enter baxyz-devbox
#
# Design: the box gets its own isolated HOME (`home=` below), separate from
# the real host $HOME. This is deliberate — the whole point of running
# node/pnpm in a box is that `npm install -g <tool>` or pnpm's global store
# inside the box must NOT land in the host's real npm/pnpm state. Letting
# distrobox bind-mount the real $HOME (its default behavior with no `home=`)
# would merge the two, defeating that isolation.
#
# What still needs to come from the real host identity — git author config
# and SSH keys — is bind-mounted read-only into the box's isolated home
# below, so `git clone`/`push` and commit authorship work without any setup
# inside the box, while everything else (npm/pnpm caches, global installs,
# shell state) stays fully separate and disposable.

[baxyz-devbox]
image=docker.io/library/node:24-bookworm
hostname=baxyz-devbox
pull=true
replace=true
start_now=false
entry=false
home="${HOME}/.distrobox-baxyz-home"

# --- Mounts -----------------------------------------------------------------
# Read-only identity from the real host home — enough for git operations,
# nothing that lets the box write back into the host's real home.
# Project + sibling repos, read-write, at their real host paths (they live
# under the real $HOME on disk, but that's no longer auto-mounted now that
# `home=` points elsewhere, so each one needs its own explicit mount).
volume="${HOME}/.gitconfig:${HOME}/.distrobox-baxyz-home/.gitconfig:ro ${HOME}/.ssh:${HOME}/.distrobox-baxyz-home/.ssh:ro ${PWD}:${PWD}:rw ${PWD}/../.github:${PWD}/../.github:rw ${PWD}/../baxyz.github.io:${PWD}/../baxyz.github.io:rw ${PWD}/../gnome-extensions:${PWD}/../gnome-extensions:rw ${PWD}/../repo-proxy:${PWD}/../repo-proxy:rw ${PWD}/../mozlz4:${PWD}/../mozlz4:rw ${PWD}/../sqlite-reader:${PWD}/../sqlite-reader:rw"

# --- Packages -----------------------------------------------------------------
# additional_packages is reapplied on every container start: no rebuild
# concept to manage, the declarative list is the source of truth.
additional_packages="git-lfs build-essential"

pre_init_hooks="apt-get update"
# No `git lfs install` hook: it would try to write LFS filter config into
# ~/.gitconfig, which is mounted read-only here. If the host already has
# git-lfs configured globally, that filter config is already visible through
# the read-only mount above — nothing to register again from inside the box.
init_hooks="corepack enable"
init_hooks="corepack prepare pnpm@11.4.0 --activate"

# --- Optional, enable if needed -------------------------------------------------
# GitHub CLI (replaces the github-dev feature). Unlike .gitconfig/.ssh above,
# ~/.config/gh isn't mounted by default — add it read-only if gh is needed
# inside the box, provided `gh auth login` was run once on the host:
# volume="... ${HOME}/.config/gh:${HOME}/.distrobox-baxyz-home/.config/gh:ro"
# additional_packages="git-lfs build-essential gh"
#
# Playwright/Firefox for e2e tests (replaces playwright-dev):
# init_hooks="npx --yes playwright install --with-deps firefox"
#
# Access to the host docker daemon (replaces docker-outside-of-docker), if a
# pnpm script needs it:
# volume="... /var/run/docker.sock:/var/run/docker.sock:rw"
